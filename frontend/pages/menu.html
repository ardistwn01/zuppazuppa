<script src="/js/main.js"></script>
<script>
  // Kategori urutan tampil
  const kategoriOrder = ['Soup','Pasta','Zuppa','Snack','Steak','Nasi Goreng'];

  fetch('/api/produk?is_aktif=1')
    .then(r => r.json()).then(data => {
      renderMenu(data.data || []);
    }).catch(() => {
      // Dummy fallback
      const dummy = [];
      const cats = ['Soup','Pasta','Snack'];
      cats.forEach(cat => {
        for(let i=0;i<3;i++) dummy.push({id_produk: Math.random(), nama:'Zuppa Soup', deskripsi:'Soup Cream dengan Topping Irisan Ayam, Jagung dan Daging Asap Yang Creamy', harga:22000, kategori:cat, gambar:null});
      });
      renderMenu(dummy);
    });

  function renderMenu(products) {
    const container = document.getElementById('menuContent');
    if (!products.length) { container.innerHTML = '<p class="empty-msg">Menu belum tersedia.</p>'; return; }

    // Group by kategori
    const grouped = {};
    products.forEach(p => {
      const cat = p.kategori || 'Lainnya';
      if (!grouped[cat]) grouped[cat] = [];
      grouped[cat].push(p);
    });

    // Sort categories
    const sortedCats = Object.keys(grouped).sort((a,b) => {
      const ia = kategoriOrder.indexOf(a), ib = kategoriOrder.indexOf(b);
      if (ia === -1 && ib === -1) return a.localeCompare(b);
      if (ia === -1) return 1; if (ib === -1) return -1;
      return ia - ib;
    });

    container.innerHTML = sortedCats.map(cat => `
      <div class="menu-section fade-in">
        <h2 class="category-title">${cat}</h2>
        <div class="menu-grid">
          ${grouped[cat].map(p => `
            <div class="menu-card">
              <div class="menu-card-img">
                ${p.gambar ? `<img src="/uploads/${p.gambar}" alt="${p.nama}"/>` : '<div class="img-fallback">🍲</div>'}
              </div>
              <div class="menu-card-body">
                <h4>${p.nama}</h4>
                <p>${p.deskripsi || ''}</p>
                <span class="price">Rp. ${Number(p.harga).toLocaleString('id-ID')}</span>
              </div>
            </div>`).join('')}
        </div>
      </div>`).join('');
  }
</script>
</body>
