<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login – ZuppaZuppa CMS</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../css/style.css"/>
</head>
<body class="login-body">

<div class="login-bg">
  <div class="login-page-header">
    <span>LOGIN</span>
    <a href="/" class="login-back">✕ Kembali ke Website</a>
  </div>

  <div class="login-center">
    <div class="login-card" id="loginCard">
      <div class="login-logo">ZuppaZuppa</div>
      <p class="login-sub">CMS – Content Management System</p>

      <div class="form-group">
        <input type="text" id="username" placeholder="Username" autocomplete="username"/>
      </div>
      <div class="form-group" style="position:relative;">
        <input type="password" id="password" placeholder="Password" autocomplete="current-password"/>
        <span onclick="togglePassword('password',this)" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);cursor:pointer;">
<i class="fa-solid fa-eye"></i></span>
      </div>
      <div class="form-group">
        <select id="levelLogin" onchange="toggleKode()">
          <option value="2">Staff</option>
          <option value="1">Admin</option>
        </select>
      </div>
      <div class="form-group" id="kodeField" style="display:none;position:relative;">
        <input type="password" id="kodeKhusus" placeholder="Kode Khusus Admin"/>
        <span onclick="togglePassword('kodeKhusus',this)" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);cursor:pointer;">
<i class="fa-solid fa-eye"></i></span>
      </div>

      <div class="login-error" id="loginError" style="display:none;"></div>

      <button class="btn-primary btn-full" id="loginBtn" onclick="doLogin()">Login</button>
    </div>
  </div>
</div>

<script src="../js/main.js"></script>
<script>
  // Jika sudah login, redirect
  const token = localStorage.getItem('zz_token');
  const role  = localStorage.getItem('zz_role');
  if (token) {
    window.location.href = role === 'admin' ? '/dashboard-admin' : '/dashboard-staff';
  }

  function toggleKode() {
    const isAdmin = document.getElementById('levelLogin').value === '1';
    document.getElementById('kodeField').style.display = isAdmin ? 'block' : 'none';
  }

  function togglePassword(id, el){
    const input=document.getElementById(id);
    const icon=el.querySelector('i');
    if(input.type==='password'){
      input.type='text';
      icon.classList.remove('fa-eye');
      icon.classList.add('fa-eye-slash');
    }else{
      input.type='password';
      icon.classList.remove('fa-eye-slash');
      icon.classList.add('fa-eye');
    }
  }

  async function doLogin() {
    const btn   = document.getElementById('loginBtn');
    const err   = document.getElementById('loginError');
    const uname = document.getElementById('username').value.trim();
    const pass  = document.getElementById('password').value;
    const kode  = document.getElementById('kodeKhusus').value.trim();
    const isAdm = document.getElementById('levelLogin').value === '1';

    err.style.display = 'none';
    if (!uname || !pass) { showError('Username dan password wajib diisi.'); return; }
    if (isAdm && !kode)  { showError('Kode khusus wajib diisi untuk Admin.'); return; }

    btn.disabled = true; btn.textContent = 'Memproses...';

    try {
      const res  = await fetch('/api/auth/login', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ username: uname, password: pass, kode_khusus: isAdm ? kode : undefined })
      });
      const data = await res.json();
      if (!res.ok) { showError(data.message || 'Login gagal.'); return; }

      localStorage.setItem('zz_token', data.token);
      localStorage.setItem('zz_role',  data.role);
      localStorage.setItem('zz_user',  data.username);

      window.location.href = data.role === 'admin' ? '/dashboard-admin' : '/dashboard-staff';
    } catch (e) {
      showError('Tidak dapat terhubung ke server. Pastikan backend sudah berjalan.');
    } finally {
      btn.disabled = false; btn.textContent = 'Login';
    }
  }

  function showError(msg) {
    const err = document.getElementById('loginError');
    err.textContent = msg; err.style.display = 'block';
  }

  // Enter key
  document.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
</script>
</body>
</html>
